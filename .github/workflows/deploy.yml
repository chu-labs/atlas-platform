name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  CLUSTER: atlas-agentic-lab
  SERVICE: atlas-platform
  ECR_REPO: atlas-agentic-lab/atlas-platform

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The required reviewer on this environment is the human gate for deployment.
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Render task definition with the new image
        run: |
          aws ecs describe-task-definition --task-definition "$CLUSTER-$SERVICE" --query taskDefinition > td.json
          jq --arg img "${{ needs.build.outputs.image }}" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' td.json > td.new.json
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: td.new.json
          cluster: ${{ env.CLUSTER }}
          service: ${{ env.SERVICE }}
          wait-for-service-stability: true
          desired-count: 1
      - name: Announce the deployment on the lab event bus
        run: |
          aws events put-events --entries "[{\"Source\":\"atlas.github\",\"DetailType\":\"deploy.completed\",\"EventBusName\":\"$CLUSTER\",\"Detail\":$(jq -cn --arg sha "$GITHUB_SHA" --arg img "${{ needs.build.outputs.image }}" --arg run "$GITHUB_RUN_ID" --arg actor "$GITHUB_ACTOR" '{repo:"atlas-platform",service:"atlas-platform",sha:$sha,image:$img,run_id:$run,actor:$actor}' | jq -R .)}]"
